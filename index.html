<!doctype html>
<html>

<head>
    <title>TV</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="./src/main.js"></script>
</head>

<body>
    <div class="tv-and-remote">
        <div class="tv-wrapper">
            <div class="tv-inner">
                <img src="assets/tv.svg" class="tv" id="tv-image" />
                <img src="assets/tv-screen-glass.svg" class="tv-glass" id="tv-glass-image" />
                <div id="tv-sketch"></div>
            </div>
        </div>
        <button id="mobile-remote-toggle" class="mobile-remote-toggle" type="button" aria-label="Toggle remote" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="4.1" y="2.8" width="15.8" height="18.4" rx="3.1" fill="currentColor" />
                <circle cx="8.2" cy="7.2" r="1.7" fill="#ff463a"/>
                <circle cx="12" cy="7.2" r="1.7" fill="#d7d7d7"/>
                <circle cx="15.8" cy="7.2" r="1.7" fill="#d7d7d7"/>
                <rect x="7.3" y="10.5" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="10.8" y="10.5" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="14.3" y="10.5" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="7.3" y="14.1" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="10.8" y="14.1" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="14.3" y="14.1" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
                <rect x="10.8" y="17.7" width="2.4" height="2.4" rx="0.6" fill="#1d1d1d"/>
            </svg>
        </button>
        <div class="tv-remote-control" id="tv-remote-control">
            <div class="btn-row">
                <button id="action-power-on-off" class="btn btn-remote btn-round btn-power-on-off"></button>
                <div class="spacer"></div>
                <button id="action-mute" class="btn btn-remote btn-round btn-mute"></button>
            </div>
            <div class="spacer-row"></div>
            <div class="tv-remote-control-digits">
                <div class="btn-row">
                    <button id="action-1" class="btn btn-remote">1</button>
                    <button id="action-2" class="btn btn-remote">2</button>
                    <button id="action-3" class="btn btn-remote">3</button>
                </div>
                <div class="btn-row">
                    <button id="action-4" class="btn btn-remote">4</button>
                    <button id="action-5" class="btn btn-remote">5</button>
                    <button id="action-6" class="btn btn-remote">6</button>
                </div>
                <div class="btn-row">
                    <button id="action-7" class="btn btn-remote">7</button>
                    <button id="action-8" class="btn btn-remote">8</button>
                    <button id="action-9" class="btn btn-remote">9</button>
                </div>
                <div class="btn-row">
                    <button id="action-toggle-channel-enter-mode" class="btn btn-remote">-/--</button>
                    <button id="action-0" class="btn btn-remote">0</button>
                    <button class="btn btn-remote">&lt;&gt;</button>
                </div>
            </div>
            <div class="spacer-row"></div>
            <div class="volume-channel-row">
                <div class="btn-segmented">
                    <button id="action-volume-increase" class="btn-segment volume-plus">+</button>
                    <div class="btn-segment-text">VOL</div>
                    <button id="action-volume-decrease" class="btn-segment volume-minus">-</button>
                </div>
                <div class="spacer"></div>
                <div class="btn-segmented">
                    <button id="action-channel-next" class="btn-segment channel-plus">+</button>
                    <div class="btn-segment-text">CHN</div>
                    <button id="action-channel-previous" class="btn-segment channel-minus">-</button>
                </div>
            </div>
            <div class="spacer-row"></div>
            <div class="spacer-row"></div>
        </div>
    </div>
    <div id="app-version" class="app-version">v0.0.0</div>
</body>

</html>
